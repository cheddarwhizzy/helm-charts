name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'charts/**'
      - '.github/workflows/**'
  push:
    branches: [ main ]
    paths:
      - 'charts/**'
      - '.github/workflows/**'

env:
  HELM_VERSION: "3.13.0"
  CHART_PATH: "charts/helm-base"

jobs:
  # Lint and test on pull requests
  lint-and-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: ${{ env.HELM_VERSION }}

    - name: Lint Helm charts
      run: |
        helm lint ${{ env.CHART_PATH }}
        helm template test-release ${{ env.CHART_PATH }} --dry-run

    - name: Install helm-unittest plugin
      run: |
        helm plugin install https://github.com/helm-unittest/helm-unittest.git
        echo "✅ helm-unittest plugin installed"

    - name: Run helm-unittest tests
      run: |
        helm unittest ${{ env.CHART_PATH }}
        echo "✅ All unit tests passed"

    - name: Test chart rendering
      run: |
        # Test with default values
        helm template test-release ${{ env.CHART_PATH }} > /tmp/default.yaml
        echo "✅ Default values render successfully"
        
        # Test with example values if they exist
        if [ -f "${{ env.CHART_PATH }}/examples/node-app.yaml" ]; then
          helm template test-release ${{ env.CHART_PATH }} -f ${{ env.CHART_PATH }}/examples/node-app.yaml > /tmp/example.yaml
          echo "✅ Example values render successfully"
        fi
        
        # Test with different workload types
        helm template test-release ${{ env.CHART_PATH }} --set kind=StatefulSet > /tmp/statefulset.yaml
        helm template test-release ${{ env.CHART_PATH }} --set kind=Job > /tmp/job.yaml
        helm template test-release ${{ env.CHART_PATH }} --set kind=CronJob > /tmp/cronjob.yaml
        helm template test-release ${{ env.CHART_PATH }} --set kind=DaemonSet > /tmp/daemonset.yaml
        echo "✅ All workload types render successfully"

  # Deploy on merge to main
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: []
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: ${{ env.HELM_VERSION }}

    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Auto-bump chart version
      id: version
      run: |
        CHART_FILE="${{ env.CHART_PATH }}/Chart.yaml"
        CURRENT_VERSION=$(grep '^version:' $CHART_FILE | cut -d' ' -f2)
        echo "Current version: $CURRENT_VERSION"
        
        # Parse version components
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
        
        # Increment patch version
        NEW_PATCH=$((PATCH + 1))
        NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
        echo "New version: $NEW_VERSION"
        
        # Update Chart.yaml
        sed -i "s/^version: .*/version: $NEW_VERSION/" $CHART_FILE
        
        # Update appVersion if it matches the old version
        if grep -q "appVersion: $CURRENT_VERSION" $CHART_FILE; then
          sed -i "s/^appVersion: .*/appVersion: $NEW_VERSION/" $CHART_FILE
        fi
        
        echo "Updated Chart.yaml to version $NEW_VERSION"

        # Every later step reads the version from here. It used to be published
        # nowhere, while `Create Release` referenced
        # steps.version.outputs.new_version with no step declaring `id: version`
        # — so the tag rendered as "helm-base-" with an empty version.
        echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

        # NOT committed here. The bump and the index update are one release, so
        # they are committed together at the end. Committing here is what left
        # main at 0.1.51 while the published index sat at 0.1.46: the bump
        # landed, the publish then failed, and the next run bumped again.

    - name: Package chart
      run: |
        rm -rf .cr-release-packages && mkdir -p .cr-release-packages
        helm package ${{ env.CHART_PATH }} -d .cr-release-packages
        ls -la .cr-release-packages/

    - name: Create GitHub release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.version.outputs.new_version }}
      run: |
        # Tag is the BARE version and the asset is helm-base-<version>.tgz,
        # because that is what the published index.yaml URLs already point at:
        #   .../releases/download/0.1.46/helm-base-0.1.46.tgz
        # Changing the shape would orphan every existing entry.
        gh release create "$VERSION" \
          --title "helm-base-$VERSION" \
          --notes "Automated release of helm-base $VERSION from main." \
          ".cr-release-packages/helm-base-$VERSION.tgz" \
          --repo ${{ github.repository }}

    - name: Update the served repository index
      env:
        VERSION: ${{ steps.version.outputs.new_version }}
      run: |
        # index.yaml AT THE REPOSITORY ROOT is what GitHub Pages serves and what
        # `helm dependency build` reads. The previous job generated
        # packages/index.yaml and then ran `git add index.yaml`, adding a root
        # file it never wrote — so the served index stayed frozen at 0.1.46
        # through five version bumps.
        #
        # --merge keeps every existing entry (and their URLs); --url gives the
        # NEW entry the release-download base it is actually hosted at.
        helm repo index .cr-release-packages \
          --url "https://github.com/${{ github.repository }}/releases/download/$VERSION" \
          --merge index.yaml

        cp .cr-release-packages/index.yaml index.yaml

        echo "Newest entries now in the served index:"
        grep -E "^\s+version:" index.yaml | head -3

    - name: Commit the release
      run: |
        # One commit for the bump AND the index, so a failed publish can never
        # leave a bumped Chart.yaml behind with nothing published.
        git add ${{ env.CHART_PATH }}/Chart.yaml index.yaml
        if git diff --cached --quiet; then
          echo "Nothing to commit."
          exit 0
        fi
        git commit -m "chore: release chart version ${{ steps.version.outputs.new_version }} [skip ci]"
        git push origin main

    - name: Upload chart package
      uses: actions/upload-artifact@v4
      with:
        name: chart-packages
        path: .cr-release-packages/


  # Security scanning
  security-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
