{{- $root := . -}}
{{- $name := include "helm-base.fullname" . }}
{{- $commonLabels := include "helm-base.commonLabels" . }}
{{- $commonAnnotations := include "helm-base.commonAnnotations" . }}
{{- $externalSecrets := deepCopy .Values.externalSecrets | mergeOverwrite (deepCopy .Values.global.externalSecrets) -}}

{{- range $key, $values := $externalSecrets }}
{{- $secretStoreName := coalesce "aws-parameter-store" (printf "%s-%s" $name $root.Values.secretStore.name) $root.Values.secretStore.fullname }}
{{- $name := default (printf "%s-%s" $name $key) $values.fullname }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
{{- $commonLabels | nindent 4 }}
  {{- if $commonAnnotations }}
  annotations:
{{- $commonAnnotations | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ default "1h" $values.refreshInterval }}
  secretStoreRef:
    name: {{ $secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ $name }} # name of kubernetes secret to create
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v1
      {{- /*
        mergePolicy is emitted ONLY when a chart asks for one.

        It was previously hardcoded to Replace, which is already the operator's
        default — so it changed no behaviour, and on any cluster whose
        ExternalSecret CRD predates the field it is silently PRUNED on write.
        The rendered manifest then permanently disagrees with the live object,
        every ExternalSecret this chart produces reports OutOfSync in Argo CD
        forever, and a sync never converges because the field cannot be stored.
        That destroys the deploy signal for the whole application: real drift
        becomes indistinguishable from this steady-state noise.

        Observed on external-secrets v0.9.13, whose v1beta1 schema offers only
        data / engineVersion / metadata / templateFrom / type under
        target.template.

        Set `mergePolicy: Merge` per externalSecret to opt in, on a cluster
        whose CRD supports it. Omitted, the operator applies its own default,
        which is Replace — identical to the old hardcoded value.
      */}}
      {{- with $values.mergePolicy }}
      mergePolicy: {{ . }}
      {{- end }}
      data:
{{- range $esKey, $esVal := $values.data }}
        {{ $esKey }}: '{{ "{{" }} index . {{ printf "%q" $esKey }} | toString {{ "}}" }}'
{{- end }}
  data:
{{- range $esKey, $esVal := $values.data }}
  - secretKey: {{ $esKey }} # load parameter into '{{ $esKey }}' temp key
    remoteRef:
      key: {{ tpl $esVal $root }}
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
{{- end }}

{{- end }} {{/* end range c */}}
